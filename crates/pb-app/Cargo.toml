[package]
name = "pbweb-app"
version = "0.2.10"
edition = "2021"

[[bin]]
name = "pbweb-app"
path = "src/main.rs"

[features]
default = []
device = ["pb-sys/device"]
# Pro 903 / FW2 build: legacy WiFi path, no library-scan broadcast,
# async WiFi prompt (no DialogSynchro on FW2). Implies pb-sys/pro903.
pro903 = ["pb-sys/pro903"]
# Button-first wording (hints describe keys, not taps). On by default
# for touch-less readers; the 903 build enables it alongside pro903.
keyonly = []

[dependencies]
pb-sys = { path = "../pb-sys" }
pb-core = { path = "../pb-core" }
pb-server = { path = "../pb-server" }
pb-ui = { path = "../pb-ui" }
qrcode = { version = "0.14", default-features = false }
