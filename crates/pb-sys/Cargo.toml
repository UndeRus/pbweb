[package]
name = "pb-sys"
version = "0.1.0"
edition = "2021"
description = "Minimal hand-written FFI for PocketBook InkView (no bindgen, portable across FW 5.x-6.x)"

[features]
default = []
device = []  # enable only when linking against real libinkview on device target
# Pro 903 / FW2: drops hard links to symbols the old libinkview lacks
# (DialogSynchro, SendEventTo) and avoids the FW5/6-only NetInfo layout.
pro903 = []
